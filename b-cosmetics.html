<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>B קוסמטיקס</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Heebo',sans-serif;background:#fdf5f0;color:#2a1410}
.topbar{background:linear-gradient(135deg,#fff5f7,#fff);border-bottom:1px solid #f5dde3;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(180,60,80,.08)}
.cart-btn{background:linear-gradient(135deg,#c8506a,#8b2a42);color:#fff;border:none;border-radius:28px;padding:9px 16px;font-family:'Heebo',sans-serif;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(140,42,66,.3);transition:all .2s}
.cart-btn:hover{transform:translateY(-1px)}
.badge{background:#fff;color:#8b2a42;border-radius:50%;width:20px;height:20px;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.hero{background:linear-gradient(135deg,#fdeef1,#fdf5f0,#f9e8ed);padding:12px 20px;text-align:center;border-bottom:1px solid #f0dde3}
.hero h2{font-size:14px;color:#8b2a42;font-weight:700}
.hero p{font-size:11px;color:#c47;margin-top:2px}
.steps{display:flex;justify-content:center;padding:10px 20px;background:#fff;border-bottom:1px solid #f0e0d6}
.step{display:flex;align-items:center;gap:5px;font-size:12px;color:#ccc}
.step.active{color:#8b2a42;font-weight:700}
.step.done{color:#2a9d6a}
.snum{width:20px;height:20px;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}
.sline{width:28px;height:2px;background:#eee;margin:0 3px}
.controls{padding:11px 14px;background:#fff;border-bottom:1px solid #f5eae8}
.swrap{position:relative;margin-bottom:9px}
.sinput{width:100%;padding:9px 36px 9px 13px;border:1.5px solid #e8d8db;border-radius:28px;font-family:'Heebo',sans-serif;font-size:13px;background:#fdf8f9;outline:none}
.sinput:focus{border-color:#c8506a}
.sico{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px}
.pills{display:flex;gap:5px;flex-wrap:wrap}
.pill{padding:5px 11px;border-radius:18px;font-size:11px;font-weight:600;border:1.5px solid #e8d0d5;background:#fff;color:#aaa;cursor:pointer;transition:all .2s;white-space:nowrap}
.pill.on{background:linear-gradient(135deg,#c8506a,#8b2a42);border-color:transparent;color:#fff}
.pill:hover:not(.on){border-color:#c8506a;color:#8b2a42}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px;padding:13px 15px}
.card{background:#fff;border-radius:16px;overflow:hidden;border:1px solid #f0e0e5;transition:all .25s;display:flex;flex-direction:column}
.card:hover{box-shadow:0 6px 22px rgba(140,40,60,.13);transform:translateY(-2px)}
.cimg{width:100%;height:118px;display:flex;align-items:center;justify-content:center;position:relative}
.cimg img{width:100%;height:100%;object-fit:contain;padding:8px}
.cbadge{position:absolute;top:6px;right:6px;background:linear-gradient(135deg,#ff6b8a,#c8506a);color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:8px}
.cbody{padding:8px 10px 10px;flex:1;display:flex;flex-direction:column}
.cbrand{font-size:9px;color:#c47;font-weight:700;text-transform:uppercase;letter-spacing:.3px;display:flex;justify-content:space-between}
.cnum{font-size:8px;color:#d9b8be;background:#fdf0f2;padding:1px 4px;border-radius:4px}
.cname{font-size:12px;font-weight:700;color:#2a1410;margin:2px 0 3px;line-height:1.3}
.cdesc{font-size:10px;color:#bbb;line-height:1.4;flex:1;margin-bottom:7px}
.cfoot{display:flex;align-items:center;justify-content:space-between}
.cprice{font-size:15px;font-weight:800;color:#8b2a42}
.abtn{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#c8506a,#8b2a42);border:none;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(140,42,66,.3);transition:all .2s;line-height:1}
.abtn:hover{transform:scale(1.1)}
.qc{display:flex;align-items:center;gap:3px}
.qc button{width:26px;height:26px;border-radius:50%;border:2px solid #8b2a42;background:#fff;color:#8b2a42;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700}
.qc button:hover{background:#8b2a42;color:#fff}
.qn{font-size:13px;font-weight:800;min-width:18px;text-align:center}
.overlay{display:none;position:fixed;inset:0;background:rgba(40,10,15,.45);z-index:200;backdrop-filter:blur(2px)}
.overlay.open{display:block}
.cpanel{position:fixed;top:0;left:0;height:100%;width:min(350px,96vw);background:#fff;z-index:201;transform:translateX(-100%);transition:transform .3s ease;display:flex;flex-direction:column;box-shadow:6px 0 40px rgba(0,0,0,.14)}
.cpanel.open{transform:translateX(0)}
.cphead{background:linear-gradient(135deg,#fdeef1,#fff);padding:12px 16px;border-bottom:1px solid #f5dde3;display:flex;align-items:center;justify-content:space-between}
.cptitle{font-size:15px;font-weight:800;color:#8b2a42}
.xbtn{background:none;border:none;font-size:20px;cursor:pointer;color:#ccc}
.xbtn:hover{color:#8b2a42}
.citems{flex:1;overflow-y:auto;padding:8px 14px}
.cempty{text-align:center;padding:40px 20px;color:#ccc;font-size:13px}
.citem{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #faf0f2}
.ciimg{width:42px;height:42px;border-radius:10px;object-fit:contain;padding:3px;flex-shrink:0}
.ciinfo{flex:1;min-width:0}
.ciname{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cibrand{font-size:10px;color:#c47}
.ciright{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.ciqc{display:flex;align-items:center;gap:3px}
.ciqb{width:22px;height:22px;border-radius:50%;border:1.5px solid #e0c8cc;background:#fff;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#8b2a42}
.ciqb:hover{background:#8b2a42;color:#fff}
.ciq{font-size:12px;font-weight:800;min-width:16px;text-align:center}
.ciprice{font-size:13px;font-weight:800;color:#8b2a42}
.cfoot2{padding:12px 16px;border-top:1px solid #f0dde3;background:linear-gradient(135deg,#fdeef1,#fff)}
.trow{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;color:#999}
.trow.bold{font-size:16px;font-weight:800;color:#2a1410;margin-bottom:11px}
.fship{font-size:11px;color:#2a9d6a;text-align:center;margin-bottom:9px;font-weight:600}
.obtn{width:100%;padding:12px;background:linear-gradient(135deg,#c8506a,#8b2a42);color:#fff;border:none;border-radius:14px;font-family:'Heebo',sans-serif;font-size:14px;font-weight:800;cursor:pointer}
.mov{display:none;position:fixed;inset:0;background:rgba(40,10,15,.5);z-index:300;align-items:center;justify-content:center;padding:14px}
.mov.open{display:flex}
.modal{background:#fff;border-radius:22px;width:min(440px,100%);max-height:92vh;overflow-y:auto;padding:20px 18px}
.mlogo{text-align:center;margin-bottom:12px}
.mtitle{font-size:17px;font-weight:800;color:#8b2a42;text-align:center;margin-bottom:3px}
.msub{font-size:11px;color:#c47;text-align:center;margin-bottom:14px}
.frow{margin-bottom:11px}
.flabel{font-size:12px;font-weight:700;color:#555;margin-bottom:4px;display:block}
.finput{width:100%;padding:9px 12px;border:1.5px solid #e8d8db;border-radius:11px;font-family:'Heebo',sans-serif;font-size:13px;background:#fdf8f9;outline:none}
.finput:focus{border-color:#c8506a}
.pmethods{display:flex;gap:6px;margin-top:5px}
.popt{flex:1;padding:9px 4px;border:2px solid #e8d8db;border-radius:11px;text-align:center;font-size:12px;font-weight:600;cursor:pointer;color:#aaa;background:#fdf8f9;transition:all .2s}
.popt.on{border-color:#8b2a42;background:linear-gradient(135deg,#fdeef1,#fff);color:#8b2a42;font-weight:800}
.osum{background:linear-gradient(135deg,#fdeef1,#fdf5f0);border-radius:13px;padding:12px;margin:13px 0;border:1px solid #f0dde3}
.osumtitle{font-size:10px;font-weight:700;color:#c47;text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}
.srow{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;color:#888}
.srow.tot{font-size:15px;font-weight:800;color:#2a1410;border-top:1px solid #e8d8db;margin-top:7px;padding-top:7px}
.ferr{color:#c0392b;font-size:11px;text-align:center;margin-bottom:7px;display:none;background:#fff5f5;padding:6px;border-radius:7px}
.cbtn{width:100%;padding:13px;background:linear-gradient(135deg,#c8506a,#8b2a42);color:#fff;border:none;border-radius:14px;font-family:'Heebo',sans-serif;font-size:14px;font-weight:800;cursor:pointer;margin-top:4px}
.cxlink{text-align:center;margin-top:8px;font-size:11px;color:#bbb;cursor:pointer}
.cxlink:hover{color:#8b2a42}
.success{display:none;text-align:center;padding:14px 6px}
.success.show{display:block}
.ckwrap{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#e8f8f0,#d0f0e4);display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 11px}
.stitle{font-size:20px;font-weight:800;color:#2a9d6a;margin-bottom:5px}
.smsg{font-size:12px;color:#888;line-height:1.7;margin-bottom:12px}
.sonum{display:inline-block;background:linear-gradient(135deg,#fdeef1,#fdf0f4);border:1.5px solid #f0dde3;color:#8b2a42;font-size:13px;font-weight:800;padding:8px 18px;border-radius:11px;margin-bottom:12px}
.bbtn{padding:11px 26px;background:linear-gradient(135deg,#c8506a,#8b2a42);color:#fff;border:none;border-radius:12px;font-family:'Heebo',sans-serif;font-size:13px;font-weight:700;cursor:pointer}
.nores{text-align:center;padding:50px 20px;color:#ccc;grid-column:1/-1}
</style>
</head>

var cart={},cat='הכל';
function cnt(){return Object.values(cart).reduce(function(a,b){return a+b},0)}
function sub(){return P.reduce(function(s,p){return s+(cart[p[0]]||0)*p[6]},0)}
function ship(s){return s>=249?0:s>=100?25:0}
function pills(){
  var h='';
  for(var i=0;i<CATS.length;i++){
    h+='<div class="pill'+(CATS[i]===cat?' on':'')+'" onclick="setCat('+i+')">'+CATS[i]+'</div>';
  }
  document.getElementById('PL').innerHTML=h;
}
function setCat(i){cat=CATS[i];pills();render();}
function render(){
  var q=document.getElementById('SI').value.toLowerCase(),f=[],g=document.getElementById('GR'),h='';
  for(var i=0;i<P.length;i++){
    var p=P[i];
    if((cat==='הכל'||p[1]===cat)&&(!q||p[4].toLowerCase().indexOf(q)>-1||p[3].toLowerCase().indexOf(q)>-1||p[1].indexOf(q)>-1))f.push(p);
  }
  if(!f.length){g.innerHTML='<div class="nores">🔍<br><br>לא נמצאו מוצרים</div>';return;}
  for(var i=0;i<f.length;i++){
    var p=f[i],qty=cart[p[0]]||0,bg=BG[p[1]]||'#fdeef1';
    h+='<div class="card"><div class="cimg" style="background:'+bg+'"><img src="'+p[2]+'" alt="'+p[4]+'">'+(p[8]?'<span class="cbadge">חדש</span>':'')+'</div>';
    h+='<div class="cbody"><div class="cbrand"><span>'+p[3]+'</span><span class="cnum">#'+p[7]+'</span></div>';
    h+='<div class="cname">'+p[4]+'</div><div class="cdesc">'+p[5]+'</div>';
    h+='<div class="cfoot"><div class="cprice">₪'+p[6]+'</div>';
    if(qty===0)h+='<button class="abtn" onclick="add('+p[0]+')">+</button>';
    else h+='<div class="qc"><button onclick="chg('+p[0]+',-1)">−</button><span class="qn">'+qty+'</span><button onclick="chg('+p[0]+',1)">+</button></div>';
    h+='</div></div></div>';
  }
  g.innerHTML=h;
}
function add(id){cart[id]=(cart[id]||0)+1;badge();render();}
function chg(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];badge();render();cartPanel();}
function badge(){document.getElementById('CB').textContent=cnt();}
function openCart(){document.getElementById('CP').classList.add('open');document.getElementById('OV').classList.add('open');cartPanel();}
function closeCart(){document.getElementById('CP').classList.remove('open');document.getElementById('OV').classList.remove('open');}
function cartPanel(){
  var items=P.filter(function(p){return cart[p[0]]>0}),el=document.getElementById('CI'),f=document.getElementById('CF');
  if(!items.length){el.innerHTML='<div class="cempty">🛒<br>העגלה ריקה</div>';f.style.display='none';return;}
  var h='';
  for(var i=0;i<items.length;i++){
    var p=items[i];
    h+='<div class="citem"><img class="ciimg" src="'+p[2]+'" style="background:'+BG[p[1]]+'" alt="'+p[4]+'"><div class="ciinfo"><div class="ciname">'+p[4]+'</div><div class="cibrand">'+p[3]+'</div></div>';
    h+='<div class="ciright"><div class="ciprice">₪'+cart[p[0]]*p[6]+'</div><div class="ciqc"><button class="ciqb" onclick="chg('+p[0]+',-1)">−</button><span class="ciq">'+cart[p[0]]+'</span><button class="ciqb" onclick="chg('+p[0]+',1)">+</button></div></div></div>';
  }
  el.innerHTML=h;
  var s=sub(),sh=ship(s);
  f.style.display='block';
  document.getElementById('SL').textContent='₪'+s;
  document.getElementById('HL').textContent=sh===0?'חינם 🎉':'₪'+sh;
  document.getElementById('TL').textContent='₪'+(s+sh);
  document.getElementById('FN').textContent=s<100?'':(s<249?'✨ עוד ₪'+(249-s)+' ומשלוח חינם!':'🎉 משלוח חינם!');
}
function openCheckout(){if(!cnt())return;closeCart();document.getElementById('MO').classList.add('open');modalSum();}
function closeCheckout(){document.getElementById('MO').classList.remove('open');}
function modalSum(){
  var items=P.filter(function(p){return cart[p[0]]>0}),s=sub(),sh=ship(s),h='';
  for(var i=0;i<items.length;i++){var p=items[i];h+='<div class="srow"><span>'+p[4]+' x'+cart[p[0]]+'</span><span>₪'+cart[p[0]]*p[6]+'</span></div>';}
  document.getElementById('MI').innerHTML=h;
  document.getElementById('MS').textContent=sh===0?'חינם':'₪'+sh;
  document.getElementById('MT').textContent='₪'+(s+sh);
}
function selPay(el){document.querySelectorAll('.popt').forEach(function(e){e.classList.remove('on');});el.classList.add('on');}
function submitOrder(){
  var n=document.getElementById('FN1').value.trim(),ph=document.getElementById('FP').value.trim(),a=document.getElementById('FA').value.trim(),e=document.getElementById('FE');
  if(!n||!ph||!a){e.textContent='⚠️ יש למלא שם, טלפון וכתובת';e.style.display='block';return;}
  e.style.display='none';
  var num='BC'+Date.now().toString().slice(-6),s=sub(),sh=ship(s),items=P.filter(function(p){return cart[p[0]]>0}),msg='';
  for(var i=0;i<items.length;i++){var p=items[i];msg+=p[4]+' x'+cart[p[0]]+' — ₪'+cart[p[0]]*p[6]+'<br>';}
  document.getElementById('ON').textContent='מספר הזמנה: #'+num;
  document.getElementById('OM').innerHTML='הי '+n+'! 💕<br>ההזמנה שלך התקבלה.<br><br>'+msg+'<br>📦 סה"כ: ₪'+(s+sh)+'<br>נחזור אלייך לתיאום המשלוח 📱';
  document.getElementById('FC').style.display='none';
  document.getElementById('SS').classList.add('show');
  var steps=document.querySelectorAll('.step');
  for(var i=0;i<steps.length;i++){steps[i].classList.remove('active','done');steps[i].classList.add(i<2?'done':'active');}
  document.getElementById('L1').style.background='#2a9d6a';
  document.getElementById('L2').style.background='#2a9d6a';
}
function resetAll(){
  cart={};badge();render();
  document.getElementById('MO').classList.remove('open');
  document.getElementById('FC').style.display='block';
  document.getElementById('SS').classList.remove('show');
  ['FN1','FP','FA','FK'].forEach(function(id){document.getElementById(id).value='';});
  var steps=document.querySelectorAll('.step');
  for(var i=0;i<steps.length;i++){steps[i].classList.remove('active','done');if(i===0)steps[i].classList.add('active');}
  document.getElementById('L1').style.background='';
  document.getElementById('L2').style.background='';
}
pills();render();
</script>
</body>
