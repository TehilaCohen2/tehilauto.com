name: weekly-agent

on:
  schedule:
    # ימי ראשון 17:00 UTC (20:00 שעון ישראל בקיץ, 19:00 בחורף); GitHub עשוי לאחר את ההרצה
    - cron: "0 17 * * 0"
  workflow_dispatch:
    inputs:
      start_date:
        description: "אופציונלי: תאריך התחלה YYYY-MM-DD (בלי תאריך: הדוח השבועי הרגיל)"
        required: false
        default: ""
      end_date:
        description: "אופציונלי: תאריך סיום YYYY-MM-DD (ריק = היום)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: weekly-agent
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: weekly-agent/requirements.txt

      - name: Install dependencies
        run: pip install -r weekly-agent/requirements.txt

      - name: Run weekly agent
        run: python weekly-agent/agent.py
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SITE: ${{ secrets.GSC_SITE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
