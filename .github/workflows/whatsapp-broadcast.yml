name: whatsapp-broadcast

on:
  schedule:
    # ראשון/רביעי 09:00 ומוצאי שבת 20:00 שעון ישראל. כל משימה מופיעה בשתי שעות UTC (קיץ/חורף);
    # run-due מריץ רק את מה שמתאים לשעה הנוכחית בישראל. השורה האחרונה בודקת תשובות APPROVE.
    - cron: "0 6,7 * * 0,3"
    - cron: "0 17,18 * * 6"
    - cron: "15 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whatsapp-broadcast
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: whatsapp-broadcast/requirements.txt
      - run: pip install -r whatsapp-broadcast/requirements.txt
      - name: Run due tasks
        working-directory: whatsapp-broadcast
        run: python broadcast.py run-due
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SPREADSHEET_ID: ${{ secrets.BROADCAST_SPREADSHEET_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
