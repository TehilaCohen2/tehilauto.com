<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>מד זמן לפרויקטים</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>⏱ מד זמן לפרויקטים</h1>
  <div class="wrap">

  <section id="idle">
    <input id="project" type="text" list="projects" placeholder="שם הפרויקט" autocomplete="off">
    <datalist id="projects"></datalist>
    <input id="sub" type="text" list="subs-start" placeholder="תת-פרויקט (לא חובה)" autocomplete="off">
    <datalist id="subs-start"></datalist>
    <button id="start" class="primary">▶ הפעלת טיימר</button>
  </section>

  <section id="active" hidden>
    <div class="label">עובדת על:</div>
    <div id="current" class="current"></div>
    <div id="current-sub" class="current-sub"></div>
    <div id="clock" class="clock">00:00:00</div>
    <button id="stop" class="danger">■ סיום טיימר</button>
  </section>

  <details class="manual">
    <summary>➕ הוספת שעות ידנית</summary>
    <input id="m-project" type="text" list="projects" placeholder="שם פרויקט" autocomplete="off">
    <input id="m-sub" type="text" list="subs-manual" placeholder="תת-פרויקט (לא חובה)" autocomplete="off">
    <datalist id="subs-manual"></datalist>
    <div class="row">
      <input id="m-hours" type="number" min="0" placeholder="שעות">
      <input id="m-min" type="number" min="0" max="59" placeholder="דקות">
    </div>
    <input id="m-date" type="date">
    <button id="m-add" class="primary">הוספת הזמן</button>
    <div id="m-msg" class="msg"></div>
  </details>

  <h2>סיכום לפי פרויקט</h2>
  <div class="seg" id="period">
    <button data-p="today">היום</button><button data-p="week">השבוע</button><button data-p="month">החודש</button><button data-p="all">הכול</button>
  </div>
  <ul id="totals"></ul>
  <div id="empty" class="empty">עדיין אין נתונים. התחילי טיימר ראשון!</div>

  <footer>
    <button id="open" class="link">צפייה בכל הפרויקטים ←</button>
    <button id="export" class="link">ייצוא ל-CSV</button>
  </footer>

  <div class="credit">נוצר באהבה מ<a href="https://tehilauto.com" target="_blank" rel="noopener">האוטומציה שמאחורי ההצלחה</a></div>

  </div>

  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
