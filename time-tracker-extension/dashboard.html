<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>הפרויקטים שלי – מד זמן</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body { width: auto; max-width: 600px; margin: 32px auto; padding: 0; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 40px rgba(109,40,217,.15); background: var(--bg); }
    .wrap { padding: 18px; }
    h1 { font-size: 22px; padding: 22px 20px; }
    .sum { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; font-weight: 700; box-shadow: 0 4px 14px rgba(109,40,217,.10); }
    .sum #grand { font-size: 24px; direction: ltr; color: var(--brand); }
    ul { max-height: none; }
    li { padding: 13px 14px; font-size: 15px; }
    #running { color: var(--green); font-weight: 700; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>⏱ הפרויקטים שלי</h1>
  <div class="wrap">
  <div class="sum"><span>סה״כ זמן עבודה</span><span id="grand">00:00:00</span></div>
  <datalist id="projects"></datalist>
  <details class="manual">
    <summary>➕ הוספת שעות ידנית</summary>
    <input id="m-project" type="text" list="projects" placeholder="שם פרויקט" autocomplete="off">
    <input id="m-sub" type="text" list="subs-manual" placeholder="תת-פרויקט (לא חובה)" autocomplete="off">
    <datalist id="subs-manual"></datalist>
    <div class="row">
      <input id="m-hours" type="number" min="0" placeholder="שעות">
      <input id="m-min" type="number" min="0" max="59" placeholder="דקות">
    </div>
    <input id="m-date" type="date">
    <button id="m-add" class="primary">הוספת הזמן</button>
    <div id="m-msg" class="msg"></div>
  </details>
  <div id="running" class="empty" hidden></div>
  <ul id="totals"></ul>
  <div id="empty" class="empty">עדיין אין פרויקטים.</div>
  <footer><span></span><button id="export" class="link">ייצוא ל-CSV</button></footer>
  <div class="credit">נוצר באהבה מ<a href="https://tehilauto.com" target="_blank" rel="noopener">האוטומציה שמאחורי ההצלחה</a></div>

  </div>

  <script src="common.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
